lingolens:
  word-asset:
    repair-delay-ms: ${LINGOLENS_WORD_ASSET_REPAIR_DELAY_MS:180000}
    repair-initial-delay-ms: ${LINGOLENS_WORD_ASSET_REPAIR_INITIAL_DELAY_MS:90000}
    defaults:
      phonetic:
        en: ""
        zh: ""
        ja: ""
      pos:
        en: "n."
        zh: "名词"
        ja: "名詞"
      definition:
        en: "Vocabulary details are being prepared."
        zh: "词条释义正在生成中。"
        ja: "語彙の説明を準備しています。"
      example:
        en: ""
        zh: ""
        ja: ""
  llm:
    enabled: ${LINGOLENS_LLM_ENABLED:false}
    invoke-url: ${LINGOLENS_LLM_INVOKE_URL:https://integrate.api.nvidia.com/v1/chat/completions}
    authorization: ${LINGOLENS_LLM_AUTHORIZATION:}
    model: ${LINGOLENS_LLM_MODEL:stepfun-ai/step-3.7-flash}
    max-tokens: ${LINGOLENS_LLM_MAX_TOKENS:16384}
    temperature: ${LINGOLENS_LLM_TEMPERATURE:1.0}
    top-p: ${LINGOLENS_LLM_TOP_P:0.95}
    grounding-invoke-url: ${LINGOLENS_LLM_GROUNDING_INVOKE_URL:}
    grounding-authorization: ${LINGOLENS_LLM_GROUNDING_AUTHORIZATION:}
    grounding-api-key: ${LINGOLENS_LLM_GROUNDING_API_KEY:}
    grounding-model: ${LINGOLENS_LLM_GROUNDING_MODEL:minimaxai/minimax-m3}
    grounding-max-tokens: ${LINGOLENS_LLM_GROUNDING_MAX_TOKENS:400}
    grounding-temperature: ${LINGOLENS_LLM_GROUNDING_TEMPERATURE:0}
    enrichment-invoke-url: ${LINGOLENS_LLM_ENRICHMENT_INVOKE_URL:}
    enrichment-authorization: ${LINGOLENS_LLM_ENRICHMENT_AUTHORIZATION:}
    enrichment-api-key: ${LINGOLENS_LLM_ENRICHMENT_API_KEY:}
    enrichment-model: ${LINGOLENS_LLM_ENRICHMENT_MODEL:minimaxai/minimax-m3}
    enrichment-max-tokens: ${LINGOLENS_LLM_ENRICHMENT_MAX_TOKENS:2400}
    enrichment-temperature: ${LINGOLENS_LLM_ENRICHMENT_TEMPERATURE:0.1}
    image-edit-invoke-url: ${LINGOLENS_LLM_IMAGE_EDIT_INVOKE_URL:}
    image-edit-authorization: ${LINGOLENS_LLM_IMAGE_EDIT_AUTHORIZATION:}
    image-edit-api-key: ${LINGOLENS_LLM_IMAGE_EDIT_API_KEY:}
    image-edit-model: ${LINGOLENS_LLM_IMAGE_EDIT_MODEL:}
    image-edit-timeout-seconds: ${LINGOLENS_LLM_IMAGE_EDIT_TIMEOUT_SECONDS:120}
    image-edit-size: ${LINGOLENS_LLM_IMAGE_EDIT_SIZE:1024x1024}
    request-timeout-seconds: ${LINGOLENS_LLM_REQUEST_TIMEOUT_SECONDS:90}
    stream-timeout-seconds: ${LINGOLENS_LLM_STREAM_TIMEOUT_SECONDS:90}
    stream: false
    response-format:
      type: json_object
    languages:
      - code: zh
        response-key: item_zh
        name: Chinese
      - code: en
        response-key: item_en
        name: English
      - code: ja
        response-key: item_ja
        name: Japanese
    image-system-prompt: |
      你是一个语言学习类应用的后端图像识别助手。
      分析用户上传的图片，精准识别图片中央或最核心的物体。
      请直接返回以下格式的 JSON 数据，不要包含任何 Markdown 标记（如 ```json ）。
      其中 phonetic 字段统一承载英文音标、中文拼音、日文罗马音；pos 是词性；explanation 是简短释义；example 是场景例句。
      {
        "item_zh": {
          "word": "苹果",
          "phonetic": "píng guǒ",
          "pos": "名词",
          "explanation": "一种常见水果。",
          "example": "桌子上有一个红色的苹果。"
        },
        "item_en": {
          "word": "apple",
          "phonetic": "/ˈæp.əl/",
          "pos": "noun",
          "explanation": "a common fruit",
          "example": "There is a red apple on the table."
        },
        "item_ja": {
          "word": "リンゴ",
          "phonetic": "ringo",
          "pos": "名詞",
          "explanation": "一般的な果物。",
          "example": "机の上に赤いリンゴがあります。"
        }
      }
    word-system-prompt: |
      You are minimaxai/minimax-m3 acting as a senior trilingual lexicographer for a language learning app.
      Return one raw JSON object only. No markdown, no prose, no chain-of-thought.

      Required fields:
      word, displayWord, phonetic, partOfSpeech, translation, definition, exampleSentence, exampleTranslation.

      Rules:
      - word must remain a stable lowercase English object key when possible.
      - displayWord, phonetic, partOfSpeech, definition, and exampleSentence use the target language.
      - translation and exampleTranslation use the source/native language.
      - If target language is English, phonetic must be standard IPA.
      - If target language is Chinese, phonetic must be pinyin with tone marks.
      - If target language is Japanese, phonetic must include kana plus romaji, for example "ボトル / botoru".
      - definition is a professional concise meaning, not a casual one-word translation.
      - exampleSentence must be natural, short, and object-scene oriented.
      - Keep the result suitable for a mobile vocabulary card.
